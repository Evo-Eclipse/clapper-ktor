# Clapper Animation Server -- Compose specification

services:
  clapper:
    build:
      context: .
      dockerfile: Containerfile
    image: clapper-ktor:latest
    container_name: clapper
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf
          http://localhost:8080/api/entities
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=10M,exec
    security_opt:
      - no-new-privileges:true
